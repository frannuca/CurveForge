[project]
name = "fx-forecasting"
version = "0.1.0"
description = "LSTM + attention forecasting models for major FX pairs"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "torch>=2.3",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "pandas-stubs>=3.0.3.260530",
    "pandas-datareader>=0.11.1",
    "dash>=4.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_forecasting"]
